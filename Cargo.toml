[package]
name = "nox-handle-gateway"
version = "0.6.0"
edition = "2024"
license = "BUSL-1.1"

[dependencies]
aes-gcm = "0.10.3"
alloy = { version = "2.0.5", features = ["eip712"] }
anyhow = "1.0.102"
aws-config = "1.8.16"
aws-sdk-s3 = "1.132.0"
axum = "0.8.9"
axum-prometheus = "0.10.0"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
config = "0.15.22"
config-secret = "0.1.0"
futures-util = "0.3.32"
hkdf = "0.12.4"
humantime-serde = "1.1.1"
k256 = { version = "0.13.4", features = ["ecdh"] }
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry_sdk = "0.32.0"
reqwest = { version = "0.13.3", features = ["json", "query"] }
rsa = "0.9.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.10", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
temp-env = "0.3.6"
